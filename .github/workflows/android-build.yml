name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.13"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract WebView Voice Fix project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./RAJ-Walkie-Talkie-V10-LIVE-ADMIN-REALTIME-FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            ls -lah
            exit 1
          fi

          rm -rf webview_project
          mkdir -p webview_project

          unzip -q "$ZIP_FILE" -d webview_project

          PROJECT_DIR="$(find webview_project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find webview_project -maxdepth 5 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project: $PROJECT_DIR"

      - name: Validate project source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/raj/walkietalkie/MainActivity.java

          echo "Project files validated."

          echo "Current Android configuration:"
          grep -E 'compileSdk|targetSdk|minSdk|versionCode|versionName|applicationId' \
            app/build.gradle.kts || true

      - name: Fix WebKit minSdk compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking minSdk before fix:"
          grep -n "minSdk" app/build.gradle.kts || true

          # androidx.webkit:webkit:1.17.0 requires API 24.
          # Change minSdk 23 -> 24.
          sed -i -E 's/(minSdk[[:space:]]*=[[:space:]]*)23/\124/g' \
            app/build.gradle.kts

          echo "Checking minSdk after fix:"
          grep -n "minSdk" app/build.gradle.kts || true

          if grep -Eq 'minSdk[[:space:]]*=[[:space:]]*23' app/build.gradle.kts; then
            echo "ERROR: minSdk is still 23."
            exit 1
          fi

          echo "minSdk compatibility fix completed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug --stacktrace

      - name: Build release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew bundleRelease --stacktrace

      - name: Verify outputs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab

          echo "======================================"
          echo "DEBUG APK"
          echo "======================================"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "======================================"
          echo "RELEASE AAB"
          echo "======================================"
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-RELEASE-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
