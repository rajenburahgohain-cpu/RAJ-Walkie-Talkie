name: RAJ Walkie Talkie V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-v11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Verify V11 outputs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload V11 APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-DEBUG-APK
          path: android-v11/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V11 AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-RELEASE-AAB
          path: android-v11/app/build/outputs/bundle/release/app-release.aab
