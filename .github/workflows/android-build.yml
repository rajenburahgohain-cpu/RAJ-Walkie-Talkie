name: RAJ Walkie Talkie V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Verified Final V11 ZIP
        shell: bash
        run: |
          set -e

          ZIP="RAJ-Walkie-Talkie-V11-FINAL-CONNECTION-SETTINGS-VERIFIED-FIX-2026-09-24.zip"

          echo "Using verified V11 ZIP: $ZIP"

          test -f "$ZIP"

          rm -rf v11-extracted android-v11
          mkdir -p v11-extracted android-v11

          unzip -q "$ZIP" -d v11-extracted

          echo "Finding Android Gradle project..."

          PROJECT_DIR="$(find v11-extracted -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find v11-extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. android-v11/

          echo "Project files:"
          ls -la android-v11

          echo "Checking minSdk:"
          grep -n "minSdk" android-v11/app/build.gradle.kts

          echo "Checking source for old build errors..."

          if grep -R "Settings.ACTION_TETHER_SETTINGS" -n android-v11/app/src/main/java; then
            echo "ERROR: Old ACTION_TETHER_SETTINGS reference still exists."
            exit 1
          fi

          if grep -R "BillingClient.BillingClientStateListener" -n android-v11/app/src/main/java; then
            echo "ERROR: Old nested BillingClientStateListener reference still exists."
            exit 1
          fi

          echo "Source checks passed."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        working-directory: android-v11
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android-v11
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      - name: Verify Outputs
        working-directory: android-v11
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab

          echo "DEBUG APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "RELEASE AAB:"
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-DEBUG-APK
          path: android-v11/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-RELEASE-AAB
          path: android-v11/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
