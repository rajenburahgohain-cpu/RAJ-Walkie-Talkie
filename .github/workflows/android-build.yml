name: RAJ Walkie Talkie V18 Production Live

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: V18 Production Live Build
    runs-on: ubuntu-latest

    env:
      V18_ZIP: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-CORRECTED.zip
      PROJECT_DIR: android-v18

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify V18 ZIP
        run: |
          set -euo pipefail

          test -f "$V18_ZIP" || {
            echo "ERROR: $V18_ZIP not found"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          }

          ls -lh "$V18_ZIP"

      - name: Extract V18 Android project
        run: |
          set -euo pipefail

          rm -rf v18-extracted "$PROJECT_DIR"
          mkdir -p v18-extracted "$PROJECT_DIR"

          unzip -q "$V18_ZIP" -d v18-extracted

          PROJECT_SOURCE="$(find v18-extracted \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r -n1 dirname)"

          test -n "$PROJECT_SOURCE" || {
            echo "ERROR: Android project not found"
            find v18-extracted -maxdepth 7 -type f -print
            exit 1
          }

          cp -a "$PROJECT_SOURCE"/. "$PROJECT_DIR"/

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Fix LiveKit microphone coroutine calls
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              'app/src/main/java/com/raj/walkietalkie/NativeVoiceService.kt'
          )

          if not p.exists():
              raise SystemExit(
                  'ERROR: NativeVoiceService.kt not found'
              )

          s = p.read_text(encoding='utf-8')

          pkg = re.search(
              r'^package .*?$',
              s,
              re.M
          )

          if not pkg:
              raise SystemExit(
                  'ERROR: package declaration not found'
              )

          imports = [
              'import kotlinx.coroutines.CoroutineScope',
              'import kotlinx.coroutines.Dispatchers',
              'import kotlinx.coroutines.SupervisorJob',
              'import kotlinx.coroutines.cancel',
              'import kotlinx.coroutines.launch',
          ]

          missing = [
              x for x in imports
              if x not in s
          ]

          if missing:
              s = (
                  s[:pkg.end()]
                  + '\n\n'
                  + '\n'.join(missing)
                  + s[pkg.end():]
              )

          if 'private val nativeVoiceScope' not in s:

              m = re.search(
                  r'class\s+NativeVoiceService[^{]*\{',
                  s
              )

              if not m:
                  raise SystemExit(
                      'ERROR: NativeVoiceService class not found'
                  )

              field = (
                  '\n'
                  '    private val nativeVoiceScope = '
                  'CoroutineScope('
                  'SupervisorJob() + '
                  'Dispatchers.Main.immediate'
                  ')\n'
              )

              s = (
                  s[:m.end()]
                  + field
                  + s[m.end():]
              )

          lines = s.splitlines()

          out = []
          wrapped = 0

          for line in lines:

              st = line.strip()

              if (
                  '.setMicrophoneEnabled(' in line
                  and 'nativeVoiceScope.launch' not in line
                  and not st.startswith('//')
                  and not st.startswith('*')
              ):

                  if line.count('(') != line.count(')'):
                      raise SystemExit(
                          'ERROR: multiline '
                          'setMicrophoneEnabled() call found'
                      )

                  ind = line[
                      :len(line) - len(line.lstrip())
                  ]

                  out.append(
                      ind + 'nativeVoiceScope.launch {'
                  )

                  out.append(
                      '    ' + line
                  )

                  out.append(
                      ind + '}'
                  )

                  wrapped += 1

              else:
                  out.append(line)

          s = '\n'.join(out)

          if s.endswith('\n'):
              s += '\n'

          if 'nativeVoiceScope.cancel()' not in s:

              m = re.search(
                  r'override\s+fun\s+onDestroy\s*\(\s*\)\s*\{',
                  s
              )

              if m:

                  s = (
                      s[:m.end()]
                      + '\n'
                      '        nativeVoiceScope.cancel()'
                      + s[m.end():]
                  )

              else:

                  i = s.rfind('}')

                  if i < 0:
                      raise SystemExit(
                          'ERROR: class closing brace not found'
                      )

                  s = (
                      s[:i]
                      + '\n'
                      '    override fun onDestroy() {\n'
                      '        nativeVoiceScope.cancel()\n'
                      '        super.onDestroy()\n'
                      '    }\n'
                      + s[i:]
                  )

          p.write_text(
              s,
              encoding='utf-8'
          )

          if wrapped == 0:
              raise SystemExit(
                  'ERROR: no direct '
                  'setMicrophoneEnabled() call found'
              )

          print(
              f'SUCCESS: wrapped '
              f'{wrapped} microphone call(s)'
          )
          PY

          grep -n -C 3 \
            'setMicrophoneEnabled\|nativeVoiceScope' \
            app/src/main/java/com/raj/walkietalkie/NativeVoiceService.kt

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle wrapper --gradle-version 8.11.1

          chmod +x gradlew

          ./gradlew --version

      - name: Validate V18 configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          BUILD_FILE=app/build.gradle

          test -f "$BUILD_FILE" || \
          BUILD_FILE=app/build.gradle.kts

          grep -qE \
            'versionCode[[:space:]]+18' \
            "$BUILD_FILE"

          grep -qE \
            'versionName[[:space:]]+[\x27\"]18\.0[\x27\"]' \
            "$BUILD_FILE"

          grep -q \
            'livekit-android' \
            "$BUILD_FILE"

          test -f \
            app/src/main/java/com/raj/walkietalkie/NativeVoiceService.kt

          test -f \
            app/src/main/java/com/raj/walkietalkie/PttWakeMessagingService.kt

          grep -q \
            'FOREGROUND_SERVICE_MICROPHONE' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'RECORD_AUDIO' \
            app/src/main/AndroidManifest.xml

      - name: Fix Java Kotlin JVM target
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=app/build.gradle

          test -f "$BUILD_FILE" || \
          BUILD_FILE=app/build.gradle.kts

          python3 - "$BUILD_FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text(
              encoding='utf-8'
          )

          replacements = {
              'sourceCompatibility JavaVersion.VERSION_1_8':
                  'sourceCompatibility JavaVersion.VERSION_17',

              'targetCompatibility JavaVersion.VERSION_1_8':
                  'targetCompatibility JavaVersion.VERSION_17',

              'sourceCompatibility = JavaVersion.VERSION_1_8':
                  'sourceCompatibility = JavaVersion.VERSION_17',

              'targetCompatibility = JavaVersion.VERSION_1_8':
                  'targetCompatibility = JavaVersion.VERSION_17',

              "jvmTarget = '1.8'":
                  "jvmTarget = '17'",

              'jvmTarget = "1.8"':
                  'jvmTarget = "17"',
          }

          for a, b in replacements.items():
              s = s.replace(a, b)

          if (
              'sourceCompatibility JavaVersion.VERSION_17'
              not in s
          ):

              s = s.replace(
                  'android {',
                  '''android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          ''',
                  1
              )

          elif (
              "jvmTarget = '17'" not in s
              and 'jvmTarget = "17"' not in s
          ):

              if 'kotlinOptions {' in s:

                  s = s.replace(
                      'kotlinOptions {',
                      "kotlinOptions {\n"
                      "        jvmTarget = '17'",
                      1
                  )

              else:

                  s = s.replace(
                      'android {',
                      '''android {
              kotlinOptions {
                  jvmTarget = '17'
              }
          ''',
                      1
                  )

          p.write_text(
              s,
              encoding='utf-8'
          )
          PY

          grep -n \
            'sourceCompatibility\|targetCompatibility\|jvmTarget' \
            "$BUILD_FILE" || true

      - name: Configure Firebase when supplied
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then

            printf '%s' \
              "$GOOGLE_SERVICES_JSON_BASE64" \
              | base64 --decode \
              > app/google-services.json

            test -s \
              app/google-services.json

          else

            echo \
              'Firebase JSON not supplied; continuing.'

          fi

      - name: Build V18 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace

          test -s \
            app/build/outputs/apk/debug/app-debug.apk

          ls -lh \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Check Play Store signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "${KEYSTORE_BASE64:-}" || {
            echo 'ERROR: KEYSTORE_BASE64 missing'
            exit 1
          }

          test -n "${KEYSTORE_PASSWORD:-}" || {
            echo 'ERROR: KEYSTORE_PASSWORD missing'
            exit 1
          }

          test -n "${KEY_ALIAS:-}" || {
            echo 'ERROR: KEY_ALIAS missing'
            exit 1
          }

          test -n "${KEY_PASSWORD:-}" || {
            echo 'ERROR: KEY_PASSWORD missing'
            exit 1
          }

      - name: Prepare Play Store keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          printf '%s' \
            "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/release-upload.jks"

          test -s \
            "$PROJECT_DIR/release-upload.jks"

      - name: Configure release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cat >> gradle.properties <<EOF2
          RELEASE_STORE_FILE=$GITHUB_WORKSPACE/$PROJECT_DIR/release-upload.jks
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF2

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              'app/build.gradle'
          )

          s = p.read_text(
              encoding='utf-8'
          )

          if 'playStoreRelease' not in s:

              s = s.replace(
                  'android {',
                  '''android {
              signingConfigs {
                  playStoreRelease {
                      storeFile file(
                          project.property(
                              "RELEASE_STORE_FILE"
                          )
                      )
                      storePassword project.property(
                          "RELEASE_STORE_PASSWORD"
                      )
                      keyAlias project.property(
                          "RELEASE_KEY_ALIAS"
                      )
                      keyPassword project.property(
                          "RELEASE_KEY_PASSWORD"
                      )
                  }
              }
          ''',
                  1
              )

          if (
              'signingConfig signingConfigs.playStoreRelease'
              not in s
          ):

              i = s.find(
                  'release {'
              )

              if i < 0:
                  raise SystemExit(
                      'ERROR: release buildType not found'
                  )

              i += len(
                  'release {'
              )

              s = (
                  s[:i]
                  + '''
                  minifyEnabled false
                  signingConfig signingConfigs.playStoreRelease'''
                  + s[i:]
              )

          p.write_text(
              s,
              encoding='utf-8'
          )
          PY

      - name: Build V18 Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ./gradlew \
            bundleRelease \
            --stacktrace

          test -s \
            app/build/outputs/bundle/release/app-release.aab

          ls -lh \
            app/build/outputs/bundle/release/app-release.aab

      - name: Verify V18 AAB
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          jarsigner \
            -verify \
            -verbose \
            -certs \
            app/build/outputs/bundle/release/app-release.aab \
            > /tmp/v18-jarsigner.txt

          tail -25 \
            /tmp/v18-jarsigner.txt

      - name: Upload V18 Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload V18 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Final V18 Build Verification
        run: |
          echo '================================================'
          echo 'RAJ WALKIE TALKIE V18 BUILD SUCCESSFUL'
          echo 'Version Code : 18'
          echo 'Version Name : 18.0'
          echo '================================================'
