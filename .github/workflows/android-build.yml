name: RAJ Walkie Talkie V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V11 Android Project
        shell: bash
        run: |
          set -e

          ZIP="RAJ-Walkie-Talkie-V11-PLAY-STORE-PREP-GOOGLE-CALL-RECONNECT.zip"

          test -f "$ZIP"

          rm -rf v11-extracted android-v11
          mkdir -p v11-extracted android-v11

          unzip -q "$ZIP" -d v11-extracted

          PROJECT_DIR="$(find v11-extracted -type f -name gradlew -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found inside V11 ZIP."
            find v11-extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. android-v11/

          chmod +x android-v11/gradlew

          echo "V11 Android project extracted successfully."
          ls -la android-v11

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        working-directory: android-v11
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android-v11
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify V11 Outputs
        working-directory: android-v11
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab

          echo "DEBUG APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

          echo "RELEASE AAB:"
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload V11 APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-DEBUG-APK
          path: android-v11/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V11 AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-RELEASE-AAB
          path: android-v11/app/build/outputs/bundle/release/app-release.aab
