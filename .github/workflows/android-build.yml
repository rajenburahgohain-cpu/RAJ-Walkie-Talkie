name: RAJ Walkie Talkie V18 Production Live

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: V18 Production Live Build
    runs-on: ubuntu-latest

    env:
      V18_ZIP: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-CORRECTED.zip
      PROJECT_DIR: android-v18

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. VERIFY V18 ZIP
      # ============================================================
      - name: Verify V18 ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Checking RAJ Walkie Talkie V18 ZIP"
          echo "=============================================="

          if [ ! -f "$V18_ZIP" ]; then
            echo "ERROR: V18 ZIP not found:"
            echo "$V18_ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "V18 ZIP found:"
          ls -lh "$V18_ZIP"

      # ============================================================
      # 3. EXTRACT V18 AND FIND ANDROID PROJECT
      # ============================================================
      - name: Extract V18 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v18-extracted "$PROJECT_DIR"

          mkdir -p v18-extracted
          mkdir -p "$PROJECT_DIR"

          unzip -q "$V18_ZIP" -d v18-extracted

          echo "Searching for Android project..."

          PROJECT_SOURCE="$(
            find v18-extracted \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit |
              xargs -r -n1 dirname
          )"

          if [ -z "$PROJECT_SOURCE" ]; then
            echo "ERROR: Android project not found inside V18 ZIP."
            echo
            echo "ZIP contents:"
            find v18-extracted -maxdepth 7 -type f -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_SOURCE"

          cp -a "$PROJECT_SOURCE"/. "$PROJECT_DIR"/

          echo
          echo "Checking Android project..."

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "V18 Android project verified successfully."

      # ============================================================
      # 4. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 5. GRADLE 8.11.1
      # ============================================================
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # ============================================================
      # 6. ANDROID SDK
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # ============================================================
      # 7. GENERATE GRADLE WRAPPER
      # ============================================================
      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper --gradle-version 8.11.1

          chmod +x gradlew

          ./gradlew --version

      # ============================================================
      # 8. VERIFY V18 CONFIGURATION
      # ============================================================
      - name: Validate V18 configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Validating V18 Production Live"
          echo "=============================================="

          BUILD_FILE="app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="app/build.gradle.kts"
          fi

          echo "Build file:"
          echo "$BUILD_FILE"

          echo
          echo "Version information:"
          grep -nE \
            "versionCode|versionName|compileSdk|targetSdk" \
            "$BUILD_FILE" || true

          echo
          echo "Checking V18 version..."

          grep -qE "versionCode[[:space:]]+18" "$BUILD_FILE"

          grep -qE "versionName[[:space:]]+['\"]18\.0['\"]" "$BUILD_FILE"

          echo "V18 version verified."

          echo
          echo "Checking Native Voice Service..."

          test -f \
            app/src/main/java/com/raj/walkietalkie/NativeVoiceService.kt

          test -f \
            app/src/main/java/com/raj/walkietalkie/PttWakeMessagingService.kt

          echo "Native voice files found."

          echo
          echo "Checking Android Manifest..."

          grep -q "FOREGROUND_SERVICE_MICROPHONE" \
            app/src/main/AndroidManifest.xml

          grep -q "RECORD_AUDIO" \
            app/src/main/AndroidManifest.xml

          echo "Microphone foreground-service configuration verified."

          echo
          echo "Checking LiveKit..."

          grep -q "livekit-android" "$BUILD_FILE"

          echo "LiveKit dependency found."

          echo
          echo "V18 validation successful."

      # ============================================================
      # 9. OPTIONAL FIREBASE CONFIG
      # ============================================================
      - name: Configure Firebase
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          echo "Creating google-services.json..."

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode \
            > app/google-services.json

          test -s app/google-services.json

          echo "Firebase configuration created."

      # ============================================================
      # 10. DEBUG BUILD
      # ============================================================
      - name: Build V18 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "=============================================="
          echo " V18 DEBUG APK CREATED"
          echo "=============================================="

          ls -lh "$APK"

      # ============================================================
      # 11. CHECK PLAY STORE SECRETS
      # ============================================================
      - name: Check Play Store signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking signing secrets..."

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "All Play Store signing secrets are available."

      # ============================================================
      # 12. CREATE KEYSTORE
      # ============================================================
      - name: Prepare Play Store keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/release-upload.jks"

          test -s "$PROJECT_DIR/release-upload.jks"

          echo "Release keystore prepared."

      # ============================================================
      # 13. CONFIGURE RELEASE SIGNING
      # ============================================================
      - name: Configure release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> gradle.properties <<EOF

          RELEASE_STORE_FILE=$GITHUB_WORKSPACE/$PROJECT_DIR/release-upload.jks
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          echo "Gradle signing properties configured."

      # ============================================================
      # 14. PATCH RELEASE SIGNING
      # ============================================================
      - name: Configure Android release signing
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/build.gradle ]; then

            python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          if "playStoreRelease" not in text:

              signing = """
              signingConfigs {
                  playStoreRelease {
                      storeFile file(project.property("RELEASE_STORE_FILE"))
                      storePassword project.property("RELEASE_STORE_PASSWORD")
                      keyAlias project.property("RELEASE_KEY_ALIAS")
                      keyPassword project.property("RELEASE_KEY_PASSWORD")
                  }
              }
          """

              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          if "signingConfig signingConfigs.playStoreRelease" not in text:

              marker = "buildTypes {"

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + """
              release {
                  minifyEnabled false
                  signingConfig signingConfigs.playStoreRelease
              }
          """,
                      1
                  )

          path.write_text(text, encoding="utf-8")

          print("Release signing configuration added.")
          PY

          else
            echo "Kotlin DSL build detected."
            echo "Existing V18 Kotlin signing configuration will be used."
          fi

      # ============================================================
      # 15. RELEASE AAB
      # ============================================================
      - name: Build V18 Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Building V18 Production Release AAB"
          echo "=============================================="

          ./gradlew bundleRelease --stacktrace

          AAB="app/build/outputs/bundle/release/app-release.aab"

          if [ ! -s "$AAB" ]; then
            echo "ERROR: Release AAB was not created."

            find app/build/outputs \
              -type f \
              -maxdepth 6 \
              -print || true

            exit 1
          fi

          echo
          echo "V18 Production AAB:"
          ls -lh "$AAB"

      # ============================================================
      # 16. VERIFY AAB SIGNATURE
      # ============================================================
      - name: Verify V18 AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          echo "Verifying signed AAB..."

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB" \
            > /tmp/v18-jarsigner.txt

          tail -25 /tmp/v18-jarsigner.txt

          echo
          echo "AAB verification completed."

      # ============================================================
      # 17. UPLOAD V18 AAB
      # ============================================================
      - name: Upload V18 Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 18. UPLOAD V18 DEBUG APK
      # ============================================================
      - name: Upload V18 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19. FINAL SUCCESS
      # ============================================================
      - name: Final V18 Build Verification
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo " RAJ WALKIE TALKIE V18 BUILD SUCCESSFUL"
          echo "================================================"
          echo
          echo "Version Code : 18"
          echo "Version Name : 18.0"
          echo
          echo "Production AAB:"
          echo "RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-AAB"
          echo
          echo "Debug APK:"
          echo "RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-DEBUG-APK"
          echo
          echo "================================================"
