name: RAJ Walkie Talkie V12 Professional

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V12 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RAJ-Walkie-Talkie-V12-PROFESSIONAL-INCOMING-CALL-AUDIO-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V12 ZIP not found:"
            echo "$ZIP_FILE"
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using V12 ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract V12 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v12-extracted android-v12
          mkdir -p v12-extracted android-v12

          unzip -q "$ZIP_FILE" -d v12-extracted

          PROJECT_DIR="$(find v12-extracted \
            -type f \
            -name 'settings.gradle' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            find v12-extracted -maxdepth 5 -type f -print
            exit 1
          fi

          echo "V12 project found at:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. android-v12/

          echo "V12 project files:"
          find android-v12 -maxdepth 5 -type f -print

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Check V12 configuration
        working-directory: android-v12
        shell: bash
        run: |
          set -euo pipefail

          echo "=== settings.gradle ==="
          cat settings.gradle

          echo "=== app/build.gradle ==="
          cat app/build.gradle

          echo "=== Android Manifest ==="
          cat app/src/main/AndroidManifest.xml

      - name: Generate Gradle wrapper
        working-directory: android-v12
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper --gradle-version 8.11.1

          chmod +x gradlew

      - name: Build Debug APK
        working-directory: android-v12
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug --stacktrace

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-v12/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "Debug APK created:"
          ls -lh "$APK"

      - name: Configure Play Store signing
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
