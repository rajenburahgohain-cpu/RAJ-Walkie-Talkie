name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Native Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'RAJ-Walkie-Talkie-Native-Android-Starter-FIXED.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RAJ-Walkie-Talkie-Native-Android-Starter-FIXED.zip was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf native_project
          mkdir -p native_project

          unzip -q "$ZIP_FILE" -d native_project

          echo "Extracted files:"
          find native_project -maxdepth 3 -type f | head -100

          PROJECT_DIR=$(find native_project -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android Gradle Kotlin DSL configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")

          if not p.exists():
              print("ERROR: app/build.gradle.kts not found.")
              raise SystemExit(1)

          text = p.read_text(encoding="utf-8")

          # Remove misplaced compileOptions block
          text = re.sub(
              r'(?ms)^\s*compileOptions\s*\{.*?\}\s*',
              '',
              text,
              count=1
          )

          # Remove old kotlinOptions block
          text = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{.*?\}\s*',
              '',
              text,
              count=1
          )

          p.write_text(text, encoding="utf-8")

          print("Gradle Kotlin DSL configuration fixed.")
          PY

      - name: Force Java and Kotlin JVM target 17
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          block = r'''

          // CI JVM compatibility fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(
                      org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                  )
              }
          }
          '''

          # Add only once
          if "CI JVM compatibility fix" not in text:
              text += block

          p.write_text(text, encoding="utf-8")

          print("Java and Kotlin JVM targets set to 17.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."
          find app/build/outputs/apk -type f -name "*.apk" -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
