name: RAJ Walkie Talkie V18 Production Live

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: V18 Production Live Build
    runs-on: ubuntu-latest

    env:
      V18_ZIP: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-CORRECTED.zip
      PROJECT_DIR: android-v18

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify V18 ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$V18_ZIP" ]; then
            echo "ERROR: V18 ZIP not found: $V18_ZIP"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "V18 ZIP found:"
          ls -lh "$V18_ZIP"

      - name: Extract V18 Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf v18-extracted "$PROJECT_DIR"

          mkdir -p v18-extracted
          mkdir -p "$PROJECT_DIR"

          unzip -q "$V18_ZIP" -d v18-extracted

          PROJECT_SOURCE="$(
            find v18-extracted \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit |
              xargs -r -n1 dirname
          )"

          if [ -z "$PROJECT_SOURCE" ]; then
            echo "ERROR: Android project not found."
            find v18-extracted -maxdepth 7 -type f -print
            exit 1
          fi

          cp -a "$PROJECT_SOURCE"/. "$PROJECT_DIR"/

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "V18 Android project verified."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

          ./gradlew --version

      - name: Validate V18 configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="app/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="app/build.gradle.kts"
          fi

          grep -qE "versionCode[[:space:]]+18" "$BUILD_FILE"

          grep -qE "versionName[[:space:]]+['\"]18\.0['\"]" "$BUILD_FILE"

          grep -q "livekit-android" "$BUILD_FILE"

          test -f \
            app/src/main/java/com/raj/walkietalkie/NativeVoiceService.kt

          test -f \
            app/src/main/java/com/raj/walkietalkie/PttWakeMessagingService.kt

          grep -q "FOREGROUND_SERVICE_MICROPHONE" \
            app/src/main/AndroidManifest.xml

          grep -q "RECORD_AUDIO" \
            app/src/main/AndroidManifest.xml

          echo "V18 validation successful."

      - name: Configure Firebase when supplied
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then

            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
              | base64 --decode \
              > app/google-services.json

            test -s app/google-services.json

            echo "Firebase configuration created."

          else

            echo "Firebase JSON not supplied."
            echo "Continuing without Firebase JSON."

          fi

      - name: Build V18 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean assembleDebug --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "V18 Debug APK:"
          ls -lh "$APK"

      - name: Check Play Store signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: KEYSTORE_BASE64 is missing."
            exit 1
          fi

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "ERROR: KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "ERROR: KEY_PASSWORD is missing."
            exit 1
          fi

          echo "Signing secrets are available."

      - name: Prepare Play Store keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/release-upload.jks"

          test -s "$PROJECT_DIR/release-upload.jks"

          echo "Keystore prepared."

      - name: Configure release signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          cat >> gradle.properties <<EOF
          RELEASE_STORE_FILE=$GITHUB_WORKSPACE/$PROJECT_DIR/release-upload.jks
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          if "playStoreRelease" not in text:

              signing = """
              signingConfigs {
                  playStoreRelease {
                      storeFile file(project.property("RELEASE_STORE_FILE"))
                      storePassword project.property("RELEASE_STORE_PASSWORD")
                      keyAlias project.property("RELEASE_KEY_ALIAS")
                      keyPassword project.property("RELEASE_KEY_PASSWORD")
                  }
              }
              """

              text = text.replace(
                  "android {",
                  "android {" + signing,
                  1
              )

          old = "release { minifyEnabled false }"

          new = """release {
              minifyEnabled false
              signingConfig signingConfigs.playStoreRelease
          }"""

          if "signingConfig signingConfigs.playStoreRelease" not in text:

              if old in text:
                  text = text.replace(old, new, 1)
              else:
                  raise SystemExit(
                      "Expected release buildType not found."
                  )

          path.write_text(text, encoding="utf-8")

          print("Release signing configured.")
          PY

      - name: Build V18 Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building V18 Production AAB..."

          ./gradlew bundleRelease --stacktrace

          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          echo "V18 Production AAB created:"
          ls -lh "$AAB"

      - name: Verify V18 AAB
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          AAB="app/build/outputs/bundle/release/app-release.aab"

          jarsigner \
            -verify \
            -verbose \
            -certs \
            "$AAB" \
            > /tmp/v18-jarsigner.txt

          tail -25 /tmp/v18-jarsigner.txt

          echo "AAB verification completed."

      - name: Upload V18 Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-AAB
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload V18 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Final V18 Build Verification
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo " RAJ WALKIE TALKIE V18 BUILD SUCCESSFUL"
          echo "================================================"
          echo "Version Code : 18"
          echo "Version Name : 18.0"
          echo "AAB Artifact : RAJ-Walkie-Talkie-V18-PRODUCTION-LIVE-AAB"
          echo "================================================"
