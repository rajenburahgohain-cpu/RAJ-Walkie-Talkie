name: RAJ Walkie Talkie V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Final V11 ZIP
        shell: bash
        run: |
          set -e

          ZIP="RAJ-Walkie-Talkie-V11-FINAL-CONNECTION-SETTINGS.zip"

          test -f "$ZIP"

          rm -rf v11-extracted android-v11
          mkdir -p v11-extracted android-v11

          unzip -q "$ZIP" -d v11-extracted

          PROJECT_DIR="$(find v11-extracted -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. android-v11/

          echo "Project:"
          ls -la android-v11

          echo "minSdk:"
          grep -n "minSdk" android-v11/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        working-directory: android-v11
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Build Release AAB
        working-directory: android-v11
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      - name: Verify Outputs
        working-directory: android-v11
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/release/app-release.aab

          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-DEBUG-APK
          path: android-v11/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-V11-RELEASE-AAB
          path: android-v11/app/build/outputs/bundle/release/app-release.aab
