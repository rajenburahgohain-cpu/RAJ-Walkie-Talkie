name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Native Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'RAJ-Walkie-Talkie-Native-Android-Starter-FIXED.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RAJ-Walkie-Talkie-Native-Android-Starter-FIXED.zip was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf native_project
          mkdir -p native_project

          unzip -q "$ZIP_FILE" -d native_project

          echo "Extracted files:"
          find native_project -maxdepth 3 -type f | head -100

          PROJECT_DIR=$(find native_project -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android Gradle Kotlin DSL configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")

          if not p.exists():
              print("app/build.gradle.kts not found. Skipping fix.")
              raise SystemExit(0)

          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r'(?ms)^\s*compileOptions\s*\{.*?\}\s*',
              '',
              text,
              count=1
          )

          text = re.sub(
              r'(?ms)^\s*kotlinOptions\s*\{.*?\}\s*',
              '',
              text,
              count=1
          )

          p.write_text(text, encoding="utf-8")
          print("Gradle configuration fixed.")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
