name: Generate Upload Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate upload keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          keytool -genkeypair -v \
            -keystore release-upload.jks \
            -storetype JKS \
            -alias rajwalkietalkie \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=RAJ Walkie Talkie, OU=Mobile, O=RAJ, L=Assam, ST=Assam, C=IN"

          keytool -list \
            -keystore release-upload.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias rajwalkietalkie

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAJ-Walkie-Talkie-UPLOAD-KEYSTORE
          path: release-upload.jks
          if-no-files-found: error
          retention-days: 1
