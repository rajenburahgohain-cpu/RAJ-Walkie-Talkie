<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAJ Walkie Talkie</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      font-family:Arial,"Noto Sans Assamese",sans-serif;
    }

    body{
      margin:0;
      background:#f2f6fb;
      color:#17202a;
    }

    header{
      background:linear-gradient(135deg,#123c69,#087f8c);
      color:white;
      padding:22px 16px;
      text-align:center;
    }

    header h1{
      margin:0;
      font-size:26px;
    }

    header p{
      margin:7px 0 0;
      opacity:.9;
    }

    main{
      max-width:650px;
      margin:auto;
      padding:18px;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 5px 18px rgba(0,0,0,.08);
    }

    h2{
      margin-top:0;
    }

    input{
      width:100%;
      padding:13px;
      margin:8px 0;
      border:1px solid #ccd6df;
      border-radius:10px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:9px;
      border:0;
      border-radius:10px;
      background:#087f8c;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button.secondary{
      background:#365f7d;
    }

    button.danger{
      background:#b83232;
    }

    .hidden{
      display:none;
    }

    .status{
      padding:10px;
      margin-top:10px;
      border-radius:9px;
      background:#eef5f8;
    }

    .code{
      font-size:25px;
      font-weight:bold;
      text-align:center;
      padding:15px;
      border-radius:12px;
      background:#eef8f8;
      letter-spacing:2px;
      word-break:break-all;
    }

    .member{
      padding:12px;
      border-bottom:1px solid #eee;
    }

    .small{
      font-size:13px;
      color:#667;
    }
  </style>
</head>

<body>

<header>
  <h1>📻 RAJ Walkie Talkie</h1>
  <p>Private Office Communication</p>
</header>

<main>

  <!-- LOGIN -->
  <section id="loginSection" class="card">
    <h2>🔐 Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <div id="loginStatus" class="status"></div>
  </section>


  <!-- APP -->
  <section id="appSection" class="hidden">

    <div class="card">
      <h2>👤 Account</h2>

      <div id="userEmail" class="small"></div>

      <button class="danger" onclick="logout()">
        Logout
      </button>
    </div>


    <!-- CREATE OFFICE -->
    <div class="card">
      <h2>🏢 Create Office</h2>

      <input
        id="officeName"
        type="text"
        placeholder="Office নাম"
      >

      <button onclick="createOffice()">
        Create Office
      </button>

      <div id="createStatus" class="status"></div>
    </div>


    <!-- JOIN OFFICE -->
    <div class="card">
      <h2>🔗 Join Office</h2>

      <input
        id="joinCode"
        type="text"
        placeholder="RAJ-XXXXXXXX"
        autocomplete="off"
      >

      <button onclick="joinOffice()">
        Join with Link Code
      </button>

      <div id="joinStatus" class="status"></div>
    </div>


    <!-- CURRENT OFFICES -->
    <div class="card">
      <h2>🏢 My Offices</h2>

      <div id="officeList">
        Loading...
      </div>
    </div>

  </section>

</main>


<script>
  const SUPABASE_URL =
    "https://nxpagmvyoylhtprzccxs.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_AT6zontM3G2V3a0dYfzaBQ_nq6K4ozm";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  function setStatus(id, message){
    const el = document.getElementById(id);
    if(el) el.innerHTML = message;
  }


  async function login(){

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if(!email || !password){
      setStatus(
        "loginStatus",
        "❌ Email আৰু Password দিয়ক।"
      );
      return;
    }

    setStatus(
      "loginStatus",
      "🔐 Login কৰি থকা হৈছে..."
    );

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if(error){
      setStatus(
        "loginStatus",
        "❌ Login ব্যর্থ: " + escapeHtml(error.message)
      );
      return;
    }

    if(!data.session){
      setStatus(
        "loginStatus",
        "❌ Login session পোৱা নগ'ল।"
      );
      return;
    }

    showApp(data.session.user);
  }


  async function logout(){

    await supabaseClient.auth.signOut();

    document
      .getElementById("appSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    setStatus(
      "loginStatus",
      "✅ Logout সফল।"
    );
  }


  function showApp(user){

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("appSection")
      .classList.remove("hidden");

    document.getElementById("userEmail").textContent =
      "Login: " + (user.email || "");

    loadOffices();
  }


  async function createOffice(){

    const name =
      document.getElementById("officeName")
      .value.trim();

    if(!name){
      setStatus(
        "createStatus",
        "❌ Office নাম দিয়ক।"
      );
      return;
    }

    setStatus(
      "createStatus",
      "🏢 Office সৃষ্টি কৰি থকা হৈছে..."
    );

    const { data, error } =
      await supabaseClient.rpc(
        "create_office",
        {
          p_name: name
        }
      );

    if(error){
      setStatus(
        "createStatus",
        "❌ সমস্যা: " +
        escapeHtml(error.message)
      );
      return;
    }

    const office =
      Array.isArray(data) ? data[0] : data;

    if(!office){
      setStatus(
        "createStatus",
        "❌ Office data পোৱা নগ'ল।"
      );
      return;
    }

    setStatus(
      "createStatus",
      `
      <b>✅ Office সৃষ্টি সফল!</b><br><br>

      Office:
      ${escapeHtml(office.name)}

      <br><br>

      <div class="code">
        ${escapeHtml(office.link_code)}
      </div>

      <br>
      এই Code-টো আন সদস্যসকলক Join কৰিবলৈ দিব পাৰিব।
      `
    );

    document.getElementById("officeName").value = "";

    loadOffices();
  }


  async function joinOffice(){

    const code =
      document.getElementById("joinCode")
      .value.trim();

    if(!code){
      setStatus(
        "joinStatus",
        "❌ Link Code দিয়ক।"
      );
      return;
    }

    setStatus(
      "joinStatus",
      "🔗 Office-ত Join কৰি থকা হৈছে..."
    );

    const { data, error } =
      await supabaseClient.rpc(
        "join_office",
        {
          p_link_code: code
        }
      );

    if(error){
      setStatus(
        "joinStatus",
        "❌ Join ব্যর্থ: " +
        escapeHtml(error.message)
      );
      return;
    }

    const office =
      Array.isArray(data) ? data[0] : data;

    setStatus(
      "joinStatus",
      `
      ✅ Join সফল!<br><br>
      Office:
      <b>${escapeHtml(office.name)}</b>
      `
    );

    document.getElementById("joinCode").value = "";

    loadOffices();
  }


  async function loadOffices(){

  const list = document.getElementById("officeList");

  list.innerHTML = "Loading...";

  const { data, error } =
    await supabaseClient.rpc("get_my_offices");

  if(error){
    list.innerHTML =
      "❌ " + escapeHtml(error.message);
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML =
      "এতিয়াও কোনো Office-ত Join কৰা হোৱা নাই।";
    return;
  }

  list.innerHTML = "";

  data.forEach(office => {

    const div = document.createElement("div");

    div.className = "member";

    div.innerHTML = `
      <b>🏢 ${escapeHtml(office.office_name)}</b><br>

      <span class="small">
        Role: ${escapeHtml(office.role)}
      </span>

      <br><br>

      <div class="code">
        ${escapeHtml(office.link_code)}
      </div>
    `;

    list.appendChild(div);
  });
  }


  function escapeHtml(value){

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  async function checkSession(){

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if(session){
      showApp(session.user);
    }
  }


  checkSession();
</script>

</body>
</html>
